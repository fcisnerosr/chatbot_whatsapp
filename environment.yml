name: chatbot-whatsapp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  
  # 🔹 Framework web
  - flask=3.0.3
  
  # 🔹 HTTP requests y manejo de APIs
  - requests=2.32.3
  
  # 🔹 Generación de PDFs
  - weasyprint
  - qrcode
  
  # 🔹 Desarrollo y utilidades
  - cookiecutter        # para plantillas
  - pytest              # testing básico
  - black               # formateo automático
  - flake8              # linting
  - isort               # ordena imports
  - jupyterlab          # notebooks si haces prototipos
  
  # 🔹 Dependencias via pip
  - pip:
      - python-dotenv==1.0.1
